services:
  # -------------------------------------------------------------
  # 1. SAMANVI Backend API (Flask + Gunicorn + PostgreSQL)
  # -------------------------------------------------------------
  - type: web
    name: samanvi-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: APP_ENV
        value: production
      - key: DB_SSLMODE
        value: require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MESSAGE_ENCRYPTION_KEY
        sync: false
      - key: ENABLE_LIVE_SMS
        value: "false"
      - key: SANDBOX_SECRET
        sync: false

  # -------------------------------------------------------------
  # 2. SAMANVI Landing Website (Vite + React Static Site)
  # -------------------------------------------------------------
  - type: web
    name: samanvi-web
    runtime: static
    rootDir: website
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
