services:
  db:
    image: postgres:16-alpine
    container_name: samanvi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-samanvi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file (see .env.compose.example)}
      POSTGRES_DB: ${POSTGRES_DB:-samanvi_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-samanvi_user} -d $${POSTGRES_DB:-samanvi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samanvi-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-samanvi_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-samanvi_db}
      DB_SSLMODE: disable
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in the root .env file (see .env.compose.example)}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:?Set MESSAGE_ENCRYPTION_KEY in the root .env file (see .env.compose.example)}
      ENABLE_PUSH_WORKER: "false"
      PUSH_MOCK_MODE: "false"
      AADHAAR_MOCK_MODE: "false"
      FLASK_DEBUG: "0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
